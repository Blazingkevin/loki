openapi: 3.0.0
info:
  title: Invalid Security API
  version: 1.0.0
  description: API spec with security validation issues

servers:
  - url: https://api.example.com/v1

paths:
  /secure-endpoint:
    get:
      operationId: getSecureData
      summary: Get secure data
      security:
        - UndefinedScheme: []  # This security scheme is NOT defined - should trigger error
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string

  /another-secure:
    post:
      operationId: postSecureData
      summary: Post secure data
      security:
        - ApiKey: []
        - NonExistentScheme: []  # Another undefined scheme - should trigger error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
      responses:
        '201':
          description: Created
          # Missing schema - should trigger warning

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
