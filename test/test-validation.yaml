openapi: 3.0.0
info:
  title: Test Validation API
  version: 1.0.0
  description: API spec with various validation issues for testing

servers:
  - url: https://api.example.com/v1

paths:
  /users:
    get:
      operationId: listUsers
      # Missing description/summary - should trigger warning
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    
    post:
      operationId: createUser
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created
          # Missing schema - should trigger warning
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}:
    get:
      # Missing description/summary - should trigger warning
      operationId: getUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products:
    get:
      operationId: listProducts
      description: Get list of products
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

components:
  schemas:
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    
    UserInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        name:
          type: string
    
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
          format: float
    
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    
    # Unused schemas - should trigger warnings
    UnusedSchema:
      type: object
      description: This schema is never referenced
      properties:
        id:
          type: string
        data:
          type: string
    
    AnotherUnusedSchema:
      type: object
      description: Another schema that is never used
      properties:
        value:
          type: integer
    
    DeprecatedModel:
      type: object
      deprecated: true
      description: Old model that should be removed
      properties:
        oldField:
          type: string

  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
